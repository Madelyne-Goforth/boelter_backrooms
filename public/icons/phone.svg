<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <defs>
    <clipPath id="screenClip">
      <rect x="16" y="6" width="32" height="68" rx="7"/>
    </clipPath>

    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101923"/>
      <stop offset="100%" stop-color="#294B65"/>
    </linearGradient>
  </defs>

  <!-- Rounded aluminum frame -->
  <rect x="13" y="3" width="38" height="74" rx="9"
        fill="#B8C1C9"
        stroke="#68747E"
        stroke-width="1.2"/>

  <!-- Screen and wallpaper, clipped to rounded corners -->
  <g clip-path="url(#screenClip)">
    <rect x="16" y="6" width="32" height="68"
          fill="url(#wallpaper)"/>

    <path d="M10 75 C20 43 35 32 55 42 L55 80 H10Z"
          fill="#416E8D" opacity="0.65"/>

    <path d="M10 80 C25 51 40 47 55 57 L55 85 H10Z"
          fill="#78A3BF" opacity="0.25"/>
  </g>

  <!-- Clean screen outline -->
  <rect x="16" y="6" width="32" height="68" rx="7"
        fill="none"
        stroke="#25313B"
        stroke-width="0.8"/>

  <!-- Dynamic Island -->
  <rect x="25" y="8" width="14" height="4" rx="2"
        fill="#05090D"/>

  <!-- Home indicator -->
  <rect x="28" y="69" width="8" height="1.5" rx="0.75"
        fill="#D4DEE6" opacity="0.8"/>
</svg>